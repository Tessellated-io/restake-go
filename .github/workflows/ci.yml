name: restake-go

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:

jobs:
  build-restake:
    name: "build"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Checkout private actions
        uses: actions/checkout@v7
        with:
          repository: tessellated-io/github-actions
          ref: keefer/self-refernce
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          path: .private-actions
          persist-credentials: false

      - name: Rewrite private action references
        shell: bash
        run: |
          find .private-actions -type f \
            \( -name action.yml -o -name action.yaml \) \
            -exec sed -i -E \
              's#(uses:[[:space:]]*)\$/#\1./.private-actions/#g' \
              {} +

      - name: build restake
        uses: ./.private-actions/go/build-module
        with:
          module-file: go.mod
          github-access-token: ${{ secrets.GH_ACCESS_TOKEN }}

  test-restake:
    name: "test"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: test restake
        uses: tessellated-io/github-actions/go/test-module@v1
        with:
          module-file: go.mod
          github-access-token: ${{ secrets.GH_ACCESS_TOKEN }}

  lint-restake:
    name: "lint"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: lint restake
        uses: tessellated-io/github-actions/go/lint@v1
        with:
          module-file: go.mod
          github-access-token: ${{ secrets.GH_ACCESS_TOKEN }}