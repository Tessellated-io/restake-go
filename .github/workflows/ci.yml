name: restake-go

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:

jobs:
  build-restake:
    name: "build"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: build bot
        uses: tessellated-io/github-actions/go/build-module@v1
        with:
          module-file: go.mod
          github-access-token: ${{ secrets.GH_ACCESS_TOKEN }}

  test-restake:
    name: "test"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: test bot
        uses: tessellated-io/github-actions/go/test-module@v1
        with:
          module-file: go.mod
          github-access-token: ${{ secrets.GH_ACCESS_TOKEN }}

  lint-restake:
    name: "lint"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: lint bot
        uses: tessellated-io/github-actions/go/lint@v1
        with:
          module-file: go.mod
          github-access-token: ${{ secrets.GH_ACCESS_TOKEN }}